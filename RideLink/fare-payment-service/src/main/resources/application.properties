spring.application.name=fare-payment-service
server.port=8084

# Same signing secret as account-service: all 4 services validate tokens
# issued by Account Service, so this value must stay in sync with
# account-service's jwt.secret. This service never issues tokens itself.
jwt.secret=r1d3l1nk-4cc0unt-s3rv1c3-jwt-s1gn1ng-k3y-ch4ng3-m3-1n-pr0duct10n-2026
jwt.expiration-ms=3600000

# Fare formula (see util.FareCalculator): finalFare = baseFare + (perKm * distanceKm) + (perMin * durationMin), rounded to 2dp.
fare.base-fare=100.0
fare.per-km=50.0
fare.per-min=10.0

spring.datasource.url=jdbc:h2:mem:ridelink_fare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console